[opener]
win_start = [
    { run = '''powershell -Command "Start-Process -FilePath '%s'"''', orphan = true, desc = "Open with PowerShell Start-Process", for = "windows" }
]

edit = [
    { run = 'nvim "%s"', block = true, for = "windows", desc = "Neovim" },
    { run = 'code "%s"', orphan = true, for = "windows", desc = "VS Code" },
]

[open]
prepend_rules = [
    { mime = "text/*", use = ["edit"] },
    { mime = "*", use = ["win_start"] }
]
